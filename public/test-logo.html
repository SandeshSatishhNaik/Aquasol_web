<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AquaSol Logo Visual Test</title>
  <style>
    body {
      margin: 0;
      background-color: #F5F3E9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, sans-serif;
    }
    .test-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 40px;
    }
    .full-logo-wrap {
      max-width: 520px;
      width: 90%;
      filter: drop-shadow(0 14px 32px rgba(31, 152, 235, 0.12)) drop-shadow(0 4px 10px rgba(29, 31, 20, 0.08));
    }
    .full-logo-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }
    .emblem-wrap {
      width: 140px;
      filter: drop-shadow(0 14px 28px rgba(31, 152, 235, 0.14)) drop-shadow(0 4px 10px rgba(29, 31, 20, 0.08));
    }
    .emblem-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="test-card">
    <div class="full-logo-wrap">
      <img src="/assets/aquasol-logo-full.png" alt="AquaSol Full Logo" />
    </div>
    <div class="emblem-wrap">
      <img src="/assets/aquasol-emblem-hd.png" alt="AquaSol Emblem HD" />
    </div>
  </div>
</body>
</html>
